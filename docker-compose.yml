services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: djangodesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: djangodesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangodesk -d djangodesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: sh -c "alembic upgrade head && python scripts/load_db.py"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
      APP_NAME: djangodesk
      APP_ENV: local
      LOG_LEVEL: INFO
      DATA_FILE: data/sample_records.json
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn djangodesk.api.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment: &app-env
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379
      APP_NAME: djangodesk
      APP_ENV: local
      LOG_LEVEL: INFO
      DATA_FILE: data/sample_records.json
    env_file: &keys
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["arq", "djangodesk.workers.main.WorkerSettings"]
    environment: *app-env
    env_file: *keys
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
