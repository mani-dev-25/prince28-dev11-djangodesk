[project]
name = "djangodesk"
version = "0.1.0"
description = "Django ORM expert API :  answer from the official docs with the runnable code and the SQL it produces."
readme = "README.md"
authors = [
    { name = "Manikandan A", email = "manikandan.dev.startup@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=1.26,<2",
    "pypdf>=7.1.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "poethepoet>=0.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["djangodesk"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.poe.tasks]
dev = "uvicorn djangodesk.api.main:create_app --factory --reload"
worker = "arq djangodesk.workers.main.WorkerSettings"
lint = "ruff check src tests"
test = "pytest"
cov = "pytest --cov=djangodesk --cov-report=term-missing"
migrate = "alembic upgrade head"
seed = "python scripts/load_db.py"
test-integration = "pytest tests/integration -v"
